<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Interview Coach options</title>
  <style>
    :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --accent:#2f6fed; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f2f2f7; --muted:#a1a1a6; --line:#3a3a3c; --accent:#5b8cff; } }
    body { font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 560px; margin: 32px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin-top: 16px; }
    small { color: var(--muted); display: block; font-weight: 400; }
    input[type=text], input[type=password] { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); margin-top: 4px; }
    button { margin-top: 20px; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    #status { margin-left: 10px; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Interview Coach</h1>
  <p>Practice tool: open the panel on any tab (toolbar icon or <kbd>Alt+Shift+I</kbd>), get a question, answer it out loud, then click <b>Show tip</b>.</p>

  <label for="apiKey">Anthropic API key
    <small>Optional. Without it, tips come from the built-in question bank only. Stored locally in this browser and sent only to api.anthropic.com.</small>
  </label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-...">

  <label for="model">Model <small>Default: claude-opus-5-5</small></label>
  <input id="model" type="text">

  <label for="openaiKey">OpenAI API key (backup)
    <small>Optional. Used for ChatGPT when Claude fails or has no key. Stored locally and sent only to api.openai.com.</small>
  </label>
  <input id="openaiKey" type="password" autocomplete="off" placeholder="sk-...">

  <label for="openaiModel">ChatGPT model <small>Default: gpt-5-mini</small></label>
  <input id="openaiModel" type="text">

  <label for="role">Role you're practicing for <small>Gives the tips the right level and context.</small></label>
  <input id="role" type="text">

  <label for="lang">Speech language <small>e.g. en-US, en-GB, pt-BR</small></label>
  <input id="lang" type="text">

  <label><input id="speakQuestions" type="checkbox"> Read “Ask me” questions out loud</label>

  <button id="save">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
